<!doctype html>
<meta charset="utf-8">
<!--
  La sorgente di app/opengraph-image.png. Si rigenera con:
    node scripts/render-opengraph.mjs
  Non passa da next/og: satori non ha un font in grassetto e il titolo
  usciva sottile. Chrome ha i font veri.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; background:#06080b; color:#f2f5f8;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:78px; display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
  }
  .glow {
    position:absolute; left:50%; top:-320px; width:1100px; height:1100px;
    transform:translateX(-50%); border-radius:50%; filter:blur(130px); opacity:.5;
    background:radial-gradient(circle, rgba(62,147,232,.30) 0%, transparent 68%);
  }
  .row { display:flex; align-items:center; gap:18px; position:relative; }
  .icon { width:66px; height:66px; border-radius:15px; display:block; }
  .mark { font-size:40px; font-weight:700; letter-spacing:-.03em; }
  .os {
    background-image:linear-gradient(100deg,#6fb0f0 0%,#86d6ff 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  h1 {
    font-size:92px; font-weight:700; line-height:1.02; letter-spacing:-.042em;
    position:relative;
  }
  p { font-size:30px; line-height:1.4; color:#a4b0bc; max-width:900px; margin-top:26px; position:relative; }
</style>
<div class="glow"></div>
<div class="row">
  <img class="icon" src="../public/lifeos-icon-dark.png">
  <span class="mark">Life<span class="os">OS</span></span>
</div>
<div>
  <h1>Your life.<br>One operating system.</h1>
  <p>LifeOS brings your home, finances, routines and priorities into one intelligent system.</p>
</div>
